name: Deploy Application

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}
  SPACETIMEDB_VERSION: "2.8.1"

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL -o /tmp/spacetime.tar.gz \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v${SPACETIMEDB_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/spacetime.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 /tmp/spacetimedb-cli "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" --version
      - name: Resolve SpacetimeDB database
        run: |
          if [ "$STAGE" = "prod" ]; then
            echo "SPACETIMEDB_DATABASE=takeyu-game" >> "$GITHUB_ENV"
          else
            echo "SPACETIMEDB_DATABASE=takeyu-game-${STAGE}" >> "$GITHUB_ENV"
          fi
      - name: Publish SpacetimeDB module
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          if [ -z "$SPACETIMEDB_TOKEN" ]; then
            echo "SPACETIMEDB_TOKEN が未設定です。spacetime login show --token の値をリポジトリシークレットへ追加してください。" >&2
            exit 1
          fi
          spacetime login --token "$SPACETIMEDB_TOKEN"
          bun run spacetime:publish -- "$SPACETIMEDB_DATABASE"
      - name: Deploy
        run: bun alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL -o /tmp/spacetime.tar.gz \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v${SPACETIMEDB_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/spacetime.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 /tmp/spacetimedb-cli "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" --version
      - name: Resolve SpacetimeDB database
        run: |
          if [ "$STAGE" = "prod" ]; then
            echo "SPACETIMEDB_DATABASE=takeyu-game" >> "$GITHUB_ENV"
          else
            echo "SPACETIMEDB_DATABASE=takeyu-game-${STAGE}" >> "$GITHUB_ENV"
          fi
      - name: Safety Check
        run: |
          if [ "$STAGE" = "prod" ] || [ "$SPACETIMEDB_DATABASE" = "takeyu-game" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi
          case "$SPACETIMEDB_DATABASE" in
            takeyu-game-pr-*) ;;
            *)
              echo "ERROR: Unexpected SpacetimeDB database '$SPACETIMEDB_DATABASE'"
              exit 1
              ;;
          esac
      - name: Delete SpacetimeDB preview database
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          if [ -z "$SPACETIMEDB_TOKEN" ]; then
            echo "SPACETIMEDB_TOKEN が未設定です。spacetime login show --token の値をリポジトリシークレットへ追加してください。" >&2
            exit 1
          fi
          spacetime login --token "$SPACETIMEDB_TOKEN"
          spacetime delete "$SPACETIMEDB_DATABASE" --server maincloud --yes
      - name: Destroy Preview Environment
        run: bun alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
